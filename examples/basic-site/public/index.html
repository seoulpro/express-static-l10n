<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="i18n-bundles" content="common,home">
    <title data-i18n="page.title">Example catalog</title>
  </head>
  <body>
    <main>
      <h1 data-i18n="hero.greeting" data-i18n-params='{"name":"Alex"}'>

      <input
        data-i18n="search.label"
        data-i18n-attr="placeholder aria-label"
        placeholder="Search"
        aria-label="Search"
      >
    </main>
  </body>
</html>
